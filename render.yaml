# Blueprint do Render: serviço web + Postgres, ambos no plano gratuito (Frankfurt).
# As chaves secretas NÃO ficam aqui: são colocadas no painel do Render, em Environment:
#   WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, META_APP_SECRET, GEMINI_API_KEY, ALLOWED_NUMBERS
services:
  - type: web
    name: assistente-financeiro-whatsapp
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assistente-financeiro-db
          property: connectionString
      - key: WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite,gemini-3.6-flash
      - key: GRAPH_API_VERSION
        value: v25.0
      - key: DEFAULT_CURRENCY
        value: EUR
      - key: DEFAULT_TIMEZONE
        value: Europe/Lisbon
databases:
  - name: assistente-financeiro-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
